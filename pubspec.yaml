name: museum_guide
description: "SmartMuseum - BLE beacon heritage guide demo"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_blue_plus: ^2.3.15
  permission_handler: ^13.0.2
  vibration: ^3.2.1
  video_player: ^2.14.1
  audioplayers: ^6.8.1
  material_ui: ^1.11.1
  google_fonts: ^9.0.0
  shared_preferences: ^2.5.6
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/exhibit1/
    - assets/exhibit2/
    - assets/exhibit3/
    - assets/images/
    - assets/images/exhibit1/
    - assets/images/exhibit2/
    - assets/images/exhibit3/
    - assets/audio/
    - assets/video/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/logo.png"
  adaptive_icon_background: "#6B1426"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#6B1426"
  image: "assets/branding/icon_foreground.png"
  android_12:
    color: "#6B1426"
    image: "assets/branding/icon_foreground.png"
